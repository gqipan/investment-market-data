name: release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Repository privacy and allowlist
        env:
          PYTHONPATH: src
        run: python -m market_data privacy-check --path . --repository
      - name: Build synthetic candidate
        env:
          PYTHONPATH: src
        run: >-
          python -m market_data build-candidate
          --dataset csi300-demo
          --as-of 2026-10-22
          --revision 1
          --output dist
          --generated-at 2026-10-23T00:00:00+00:00
          --code-commit "${GITHUB_SHA}"
      - name: Verify candidate
        env:
          PYTHONPATH: src
        run: >-
          python -m market_data verify-release
          --release-dir dist/data-2026-10-22-fixture-r1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-release-candidate
          path: dist/data-2026-10-22-fixture-r1
          if-no-files-found: error
          retention-days: 7
