name: daily index release

on:
  schedule:
    # Staggered checks mitigate delayed/dropped schedule events and upstream lag.
    # GitHub cron uses UTC; morning checks only consider sessions through yesterday.
    - cron: "40 13 * * *" # 21:40 Asia/Shanghai
    - cron: "17 14 * * *" # 22:17 Asia/Shanghai, extra recovery check
    - cron: "40 15 * * *" # 23:40 Asia/Shanghai
    - cron: "17 1 * * *"  # 09:17 Asia/Shanghai, avoid the busy hour boundary
  workflow_dispatch:
    inputs:
      as_of:
        description: "Optional trading date for a manual backfill (YYYY-MM-DD)"
        required: false
        type: string
      bootstrap:
        description: "Build the first full-history baseline instead of a daily delta"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Delayed scheduled runs and manual recovery must not race to publish one tag.
concurrency:
  group: daily-index-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Collect public index history and publish an immutable release
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          AS_OF_INPUT: ${{ inputs.as_of }}
          BOOTSTRAP_INPUT: ${{ inputs.bootstrap }}
          SCHEDULE_INPUT: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          NOW_DATE="$(TZ=Asia/Shanghai date +%F)"
          NOW_HOUR="$(TZ=Asia/Shanghai date +%H)"
          if [ -n "${AS_OF_INPUT}" ]; then
            UPPER_BOUND="${AS_OF_INPUT}"
          elif [ "$((10#${NOW_HOUR}))" -lt 16 ]; then
            UPPER_BOUND="$(TZ=Asia/Shanghai date -d "${NOW_DATE} -1 day" +%F)"
          else
            UPPER_BOUND="${NOW_DATE}"
          fi
          if [[ "${UPPER_BOUND}" > "${NOW_DATE}" ]]; then
            echo "upper bound ${UPPER_BOUND} is later than today ${NOW_DATE}" >&2
            exit 1
          fi

          echo "event=${GITHUB_EVENT_NAME} schedule=${SCHEDULE_INPUT:-manual} started_at=$(date -u +%FT%TZ) upper_bound=${UPPER_BOUND}"
          echo "event=${GITHUB_EVENT_NAME}; schedule=${SCHEDULE_INPUT:-manual}; upper_bound=${UPPER_BOUND}" >> "${GITHUB_STEP_SUMMARY}"

          BOOTSTRAP="${BOOTSTRAP_INPUT:-false}"
          PREVIOUS_DIR=""
          PREVIOUS_TAG=""
          PREVIOUS_SHA256=""
          if [ "${BOOTSTRAP}" = "true" ]; then
            WINDOW="$(python -m market_data.release_window latest --upper-bound "${UPPER_BOUND}")"
            TARGET_AS_OF="$(jq -r '.target' <<<"${WINDOW}")"
            START="2005-01-01"
            echo "building the first full-history baseline through ${TARGET_AS_OF}"
          else
            PREVIOUS="$(gh release list --limit 100 \
              --json tagName,isDraft,isPrerelease,publishedAt \
              --jq '[
                .[]
                | select(
                    .isDraft == false
                    and .isPrerelease == false
                    and (.tagName | test("^data-[0-9]{4}-[0-9]{2}-[0-9]{2}-r[1-9][0-9]*$"))
                  )
              ] | sort_by(.publishedAt) | last
                | if . == null then empty else [.tagName, .publishedAt] | @tsv end')"
            if [ -z "${PREVIOUS}" ]; then
              echo "no cumulative baseline release exists; run workflow_dispatch with bootstrap=true" >&2
              exit 1
            fi
            IFS=$'\t' read -r PREVIOUS_TAG PREVIOUS_PUBLISHED_AT <<<"${PREVIOUS}"
            PREVIOUS_AS_OF="${PREVIOUS_TAG:5:10}"
            WINDOW="$(python -m market_data.release_window next \
              --previous-as-of "${PREVIOUS_AS_OF}" \
              --upper-bound "${UPPER_BOUND}")"
            WINDOW_STATUS="$(jq -r '.status' <<<"${WINDOW}")"
            if [ "${WINDOW_STATUS}" = "noop" ]; then
              echo "no un-released A-share session exists after ${PREVIOUS_AS_OF} through ${UPPER_BOUND}"
              echo "No new closed trading session: latest=${PREVIOUS_AS_OF}; upper_bound=${UPPER_BOUND}" >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            START="$(jq -r '.start' <<<"${WINDOW}")"
            TARGET_AS_OF="$(jq -r '.target' <<<"${WINDOW}")"
            echo "latest release ${PREVIOUS_TAG} ends at ${PREVIOUS_AS_OF}; collecting ${START} through ${TARGET_AS_OF}"
          fi

          RUN="data/daily-${TARGET_AS_OF}"
          TAG="data-${TARGET_AS_OF}-r1"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "release ${TAG} already exists but is not the latest cumulative release; refusing to replace it" >&2
            exit 1
          fi

          if [ "${BOOTSTRAP}" != "true" ]; then
            mkdir -p previous-release
            gh release download "${PREVIOUS_TAG}" \
              --pattern 'index-data-cumulative-*.tar.gz' \
              --dir previous-release
            gh release download "${PREVIOUS_TAG}" \
              --pattern SHA256SUMS \
              --dir previous-release
            (
              cd previous-release
              sha256sum -c --ignore-missing SHA256SUMS
            )
            PREVIOUS_ARCHIVE="$(find previous-release -maxdepth 1 -name 'index-data-cumulative-*.tar.gz' -print -quit)"
            PREVIOUS_SHA256="$(sha256sum "${PREVIOUS_ARCHIVE}" | awk '{print $1}')"
            PREVIOUS_DIR="previous-cumulative"
            python -m market_data extract-cumulative \
              --archive "${PREVIOUS_ARCHIVE}" \
              --output "${PREVIOUS_DIR}"
            python - "${PREVIOUS_DIR}" "${PREVIOUS_AS_OF}" <<'PY'
          import sys
          from pathlib import Path

          from market_data.cumulative import verify_cumulative

          manifest = verify_cumulative(Path(sys.argv[1]))
          if manifest["as_of"] != sys.argv[2]:
              raise ValueError("previous release manifest date does not match its tag")
          print(f"verified previous cumulative release through {manifest['as_of']}")
          PY
            python -m market_data materialize-cumulative \
              --root "${PREVIOUS_DIR}" \
              --output "data/previous-materialized"
            echo "appending ${START} through ${TARGET_AS_OF} to ${PREVIOUS_TAG}"
          fi

          python -m market_data backfill \
            --start "${START}" \
            --end "${TARGET_AS_OF}" \
            --output "${RUN}" \
            --include-csindex \
            --allow-partial
          python -m market_data verify-delta-tree --root "${RUN}"
          python - "${RUN}" "${PREVIOUS_DIR:+data/previous-materialized/registry.json}" <<'PY'
          import json
          import sys
          from pathlib import Path

          from market_data.release_window import validate_current_coverage

          run = Path(sys.argv[1])
          report = json.loads((run / "coverage-report.json").read_text())
          expected_symbols = set()
          registry_arg = sys.argv[2]
          if registry_arg:
              registry = json.loads(Path(registry_arg).read_text())
              expected_symbols = {
                  entry["symbol"]
                  for entry in registry.get("datasets", [])
                  if entry.get("data_class") in {"normalized_price", "normalized_close"}
              }
          checked = validate_current_coverage(
              report,
              expected_symbols=expected_symbols,
          )
          print(
              f"coverage status={report['status']}; "
              f"price histories={len(checked['current_symbols'])}/"
              f"{len(report['indices'])}; "
              f"established-symbol gate={len(checked['expected_symbols'])}"
          )
          PY

          CUMULATIVE="data/cumulative-${TARGET_AS_OF}"
          if [ "${BOOTSTRAP}" = "true" ]; then
            python -m market_data build-cumulative \
              --delta-dir "${RUN}" \
              --output-dir "${CUMULATIVE}" \
              --as-of "${TARGET_AS_OF}"
          else
            python -m market_data build-cumulative \
              --delta-dir "${RUN}" \
              --output-dir "${CUMULATIVE}" \
              --as-of "${TARGET_AS_OF}" \
              --previous-dir "${PREVIOUS_DIR}" \
              --previous-release "${PREVIOUS_TAG}" \
              --previous-archive-sha256 "${PREVIOUS_SHA256}"
          fi
          python -m market_data materialize-cumulative \
            --root "${CUMULATIVE}" \
            --output "data/materialized-${TARGET_AS_OF}"

          mkdir -p dist
          DELTA_ARCHIVE="dist/index-data-delta-${TARGET_AS_OF}.tar.gz"
          CUMULATIVE_ARCHIVE="dist/index-data-cumulative-${TARGET_AS_OF}.tar.gz"
          tar -czf "${DELTA_ARCHIVE}" \
            --exclude="./request-cache" \
            -C "${RUN}" .
          tar -czf "${CUMULATIVE_ARCHIVE}" -C "${CUMULATIVE}" .
          (
            cd dist
            sha256sum ./*.tar.gz > SHA256SUMS
          )
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "Index data ${TARGET_AS_OF}" \
            --draft \
            --notes "Owner-approved public index price, calendar, and valuation cumulative snapshot. Every release contains the baseline plus all appended closed-session batches; delayed sessions are caught up before publication. The previous archive hash is recorded in cumulative-manifest.json. Private ledgers are excluded. The coverage report records source gaps; this is not a claim that every valuation field is complete. Corrections require a new revision." \
            "${CUMULATIVE_ARCHIVE}" \
            "${DELTA_ARCHIVE}" \
            dist/SHA256SUMS \
            "${RUN}/coverage-report.json" \
            "${RUN}/coverage-report.md"
          gh release edit "${TAG}" --draft=false
          echo "Published ${TAG}; collected ${START} through ${TARGET_AS_OF}" >> "${GITHUB_STEP_SUMMARY}"
